name: Fix TOC layout

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-toc-layout.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch TOC plugin options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('quartz.config.yaml')
          text = path.read_text(encoding='utf-8')
          old = '''  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
'''
          new = '''  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      maxDepth: 3
      minEntries: 2
      showByDefault: true
      collapseByDefault: false
      layout: legacy
    order: 50
    layout:
      position: right
      priority: 30
'''
          if old not in text:
              if 'source: github:quartz-community/table-of-contents' in text and 'layout: legacy' in text:
                  print('TOC layout already patched.')
              else:
                  raise SystemExit('Expected TOC block not found; refusing to patch.')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quartz.config.yaml
          if git diff --cached --quiet; then
            echo "No TOC layout changes to commit."
            exit 0
          fi
          git commit -m "Stabilize TOC layout"
          git push origin main
