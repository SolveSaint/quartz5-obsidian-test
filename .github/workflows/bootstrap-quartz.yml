name: Bootstrap Quartz 5 Obsidian site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-quartz.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone Quartz v5 and initialize Obsidian template
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git /tmp/quartz-v5

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/quartz-v5/ ./

          npm ci
          npx quartz create --template obsidian --strategy new --baseUrl SolveSaint.github.io/quartz5-obsidian-test

          python3 - <<'PY'
          from pathlib import Path

          files = {
              "README.md": r'''# Quartz 5 Obsidian Test

Live site: https://solvesaint.github.io/quartz5-obsidian-test/

This repository contains a Quartz 5 website built from an Obsidian-compatible Markdown vault.

The public website is generated from the Markdown files inside `/content`.

## How to edit the site

Open the `/content` folder as an Obsidian vault.

You can write normal Obsidian Markdown, including wikilinks, tags, folders, callouts, embeds, frontmatter, and Mermaid diagrams.

## How publishing works

When changes are pushed to GitHub, GitHub Actions builds the Quartz site and publishes it with GitHub Pages.

Workflow:

1. Edit notes in Obsidian or with AI.
2. Commit and push changes to GitHub.
3. GitHub Actions builds the Quartz site.
4. GitHub Pages updates the live website.

## Important folders

- `/content` — Obsidian vault and Quartz content source
- `/content/index.md` — homepage
- `/content/Notes` — recommended folder for regular notes
- `/content/Attachments` — recommended folder for images, PDFs, and other files
- `/quartz` — Quartz engine, plugins, components, and styles
- `/.github/workflows/deploy.yml` — GitHub Pages deployment workflow
''',
              "content/index.md": r'''---
