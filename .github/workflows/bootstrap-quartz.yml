name: Bootstrap Quartz 5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-quartz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone Quartz v5 upstream
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quartz-v5
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git /tmp/quartz-v5

      - name: Copy Quartz files into repo
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/quartz-v5/ ./

      - name: Initialize Quartz default template
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx quartz create \
            --template default \
            --strategy new \
            --links absolute \
            --baseUrl SolveSaint.github.io/quartz5-obsidian-test

      - name: Commit bootstrapped Quartz site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Quartz bootstrap changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap clean Quartz 5 site"
          git push origin main
