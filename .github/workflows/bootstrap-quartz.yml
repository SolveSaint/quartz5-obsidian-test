name: Bootstrap Quartz 5 Obsidian site

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-quartz.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Clone Quartz v5 and initialize Obsidian template
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git /tmp/quartz-v5

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/quartz-v5/ ./

          npm ci
          npx quartz create --template obsidian --strategy new --baseUrl SolveSaint.github.io/quartz5-obsidian-test

          git add -A

          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi

          git commit -m "Bootstrap Quartz 5 Obsidian site"
          git push origin main
