name: Patch TOC Options

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch table of contents plugin options
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("quartz.config.yaml")
          text = path.read_text(encoding="utf-8")

          old = """  - source: github:quartz-community/table-of-contents\n    enabled: true\n    order: 50\n    layout:\n      position: right\n      priority: 30\n"""

          new = """  - source: github:quartz-community/table-of-contents\n    enabled: true\n    options:\n      maxDepth: 3\n      minEntries: 2\n      showByDefault: true\n      collapseByDefault: false\n      layout: legacy\n    order: 50\n    layout:\n      position: right\n      priority: 30\n"""

          if old not in text:
              raise SystemExit("Expected table-of-contents block not found; refusing to patch.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quartz.config.yaml

          if git diff --cached --quiet; then
            echo "No TOC patch changes to commit."
            exit 0
          fi

          git commit -m "Set stable table of contents options"
          git push origin main
